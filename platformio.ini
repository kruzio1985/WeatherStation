; ======================================================
;  Stacja Pogody - ESP32-S3 WROOM-1 N16R8
;  Flash: 16 MB (QIO), PSRAM: 8 MB octal (OPI)
;
;  UWAGA - PSRAM na N16R8 działa tylko gdy ustawione są OBIE rzeczy:
;
;  1) board_build.arduino.memory_type = qio_opi
;     PlatformIO wybiera wtedy prekompilowany wariant SDK z katalogu
;     tools/sdk/esp32s3/qio_opi, w którym jest CONFIG_SPIRAM_MODE_OCT=1
;     (tryb OKTAL). Wariant domyślny to qio_qspi z CONFIG_SPIRAM_MODE_QUAD
;     - na N16R8 PSRAM wtedy w ogóle nie wstanie.
;
;  2) -DBOARD_HAS_PSRAM w build_flags
;     Bez tego cores/esp32/esp32-hal-psram.h wykonuje #undef CONFIG_SPIRAM
;     i cała obsługa PSRAM (psramInit/psramFound/ps_malloc) wypada
;     z kompilacji.
; ======================================================
[env:esp32s3]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Flash 16 MB ---
; UWAGA: board_build.flash_size jest IGNOROWANE przez platformę.
; Rozmiar flash bierze się z board_upload.flash_size - trafia on do
; opcji --flash_size w elf2image oraz do write_flash. Bez tego
; używany jest domyślny 8MB z definicji płytki (N8).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; --- PSRAM 8 MB octal + flash QIO ---
board_build.arduino.memory_type = qio_opi

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    mathieucarbou/ESPAsyncWebServer
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit NeoPixel @ ^1.12.0

; --- Konsola na USB ---
; Płytka jest podłączona NATYWNYM portem USB ESP32-S3 (VID:PID 303A:1001).
; Definicja płytki ustawia ARDUINO_USB_MODE=1 (sprzętowe CDC + JTAG), ale
; NIE ustawia ARDUINO_USB_CDC_ON_BOOT - domyślnie jest 0, czyli obiekt
; "Serial" to UART0 na GPIO43/44. Skutek: na COM9 nie widać ŻADNYCH
; komunikatów startowych ani LOG_*. Włączenie opcji poniżej kieruje Serial
; na wbudowany port USB (bez konwertera USB-UART).
; Gdy host USB nie jest podłączony, core 2.0.17 sam odrzuca dane
; (HWCDC::write -> flushTXBuffer), więc stacja pracująca samodzielnie
; nie zawiesi się na zapisie do Serial.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DSTACJA_HAS_CAMERA=1

; ======================================================
;  DWIE WERSJE FIRMWARE: MASTER (bin 1) i WĘZEŁ (bin 2)
;
;  Kod jest jeden - oba pliki .bin zawierają dokładnie te same
;  czujniki i piny. Różni się tylko domyślna rola magistrali RS485,
;  którą firmware zapisuje przy pierwszym starcie urządzenia:
;
;   bin 1 (master, esp32s3-master):
;     magistrala włączona, rola master, adres 1,
;     adres drugiego ESP = 0 -> master sam znajdzie węzeł (adresy 1..8)
;   bin 2 (węzeł, esp32s3-node):
;     magistrala włączona, rola węzeł, adres 2,
;     drugi ESP = 2 (master)
;
;  Wgranie drugiej wersji .bin przestawia tylko blok magistrali
;  (reszta ustawień: Wi-Fi, MQTT, kalibracja... zostaje bez zmian).
;  Gotowe pliki do pobrania buduje: tools\build_release.ps1
; ======================================================
[env:esp32s3-master]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSTACJA_ROLE_MASTER=1

[env:esp32s3-node]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DSTACJA_ROLE_MASTER=0
; Obraz LittleFS bez data\node - binarki wezla nie mieszcza sie na mniejszej
; partycji systemu plikow (patrz tools/stage_node_fs.py).
extra_scripts = pre:tools/stage_node_fs.py

; --- Węzeł na płytce z 8 MB flash (tańszy moduł niż N16R8) ---
; PSRAM octal, np. ESP32-S3-WROOM-1 N8R8.
[env:esp32s3-node-8mb]
extends = env:esp32s3-node
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions-8mb.csv

; --- Węzeł na płytce 8 MB flash + PSRAM QUAD (np. N8R2 / N8R4) ---
; Na modułach z PSRAM quad trzeba ustawić qio_qspi - inaczej
; (jak na N16R8) PSRAM nie wstanie i stacja straci 8 MB pamięci.
[env:esp32s3-node-8mb-quad]
extends = env:esp32s3-node-8mb
board_build.arduino.memory_type = qio_qspi

; ======================================================
;  Aktualizacja przez Wi-Fi (OTA)
;
;  Firmware obsługuje OTA na dwa sposoby:
;   1) strona www -> zakładka "Aktualizacja" (wgrywasz plik .bin)
;   2) ArduinoOTA na porcie 3232 (środowisko esp32s3-ota poniżej)
;
;  Wgranie po sieci z komputera:
;     pio run -e esp32s3-ota -t upload --upload-port 192.168.1.50
;  lub przez nazwę mDNS (Windows wymaga Bonjour):
;     pio run -e esp32s3-ota -t upload
;
;  Wgranie samych plików www (LittleFS) po sieci:
;     pio run -t buildfs
;     pio run -e esp32s3-ota -t uploadfs --upload-port 192.168.1.50
;
;  Hasło OTA ustawia się na stronie www w zakładce "Aktualizacja"
;  (domyślnie: stacja-ota).
; ======================================================
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = stacja-pogody.local
; Hasło musi być takie samo jak ustawione na stronie www (zakładka "Aktualizacja").
; Domyślnie w firmware jest "stacja-ota" - po zmianie popraw też tutaj.
upload_flags =
    --auth=stacja-ota

; ======================================================
;  OTA do WĘZŁA (drugi ESP) - adres własnej sieci węzła.
;  Węzeł nie łączy się z internetem, więc najprościej wgrać
;  firmware po jego punkcie dostępowym "StacjaPogody".
;     pio run -e esp32s3-node -t upload --upload-port 192.168.4.1 --auth=stacja-ota
; ======================================================
; ======================================================
;  WĘZEŁ NA ESP32-C3 SUPERMINI (4 MB flash, bez PSRAM)
;
;  Ten sam kod źródłowy co master i te same sterowniki wszystkich
;  czujników, ale węzeł pracuje WYŁĄCZNIE po magistrali RS485:
;
;   - bez strony www, bez punktu dostępowego i bez Wi-Fi,
;   - bez MQTT, serwisów pogodowych i bez OTA (firmware wgrywa się
;     kablem USB, bo bez sieci OTA i tak nie ma jak się połączyć),
;   - odczytuje wszystkie swoje czujniki i wysyła dane, logi oraz
;     statystyki do mastera. Master pokazuje je na pulpicie, zapisuje
;     na karcie SD i publikuje dalej w MQTT/Home Assistant,
;   - ustawienia (piny, adres, kalibracja kanałów) czyta i zmienia
;     master po magistrali poleceniami "pins"/"cfg"/"chan".
;
;  Bez Wi-Fi i bez serwera www zostaje dużo wolnego flasha i ponad
;  100 kB RAM-u (na C3 nie ma PSRAM), dzięki czemu węzeł nie kończy
;  pracy brakiem pamięci przy starcie.
;
;  Gotowa mapa pinów dla tej płytki jest w src/board.cpp (c3mini);
;  master ustawia ją zdalnie w zakładce "ESP #2".
;
;  C3 ma mniej pinów (GPIO 0..21), tylko 2 UART-y i nie ma
;  interfejsu SDMMC, więc obsługiwane są: I2C, OneWire, deszcz,
;  wiatr, kierunek, wilgotność gleby, LED, przycisk i RS485.
;  Karta SD działa wyłącznie po SPI.
; ======================================================
[env:esp32c3-node]
platform = espressif32 @ ^6.7.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions-4mb.csv
board_build.filesystem = littlefs

; Obraz LittleFS bez data\node (patrz tools/stage_node_fs.py).
extra_scripts = pre:tools/stage_node_fs.py

lib_deps =
    ${env:esp32s3.lib_deps}

; UWAGA: bez -DBOARD_HAS_PSRAM - C3 SuperMini nie ma PSRAM,
; a PsramAllocator sam przechodzi na zwykły heap (patrz src/config.h).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DSTACJA_ROLE_MASTER=0
    ; Węzeł bez sieci - patrz opis wyżej. Ta flaga wycina z firmware'u
    ; stronę www, punkt dostępowy, Wi-Fi, MQTT, serwisy pogodowe i OTA.
    -DSTACJA_HEADLESS=1
    ; Prędkość magistrali wpisana w firmware (patrz config.h: STACJA_NODE_BAUD).
    ; Master musi mieć ustawioną tę samą wartość w www (Ustawienia -> RS485).
    -DSTACJA_NODE_BAUD=19200
    ; Awaryjny punkt dostępowy z minimalną konfiguracją RS485 (baud, adres,
    ; piny RX/TX/DE). Włącza się tylko, gdy węzeł nie widzi poprawnej ramki
    ; od mastera - normalnie węzeł zostaje bez Wi-Fi (patrz config.h:
    ; STACJA_NODE_RECOVERY_AP). Ustaw 0, żeby budować wersję w pełni headless.
    -DSTACJA_NODE_RECOVERY_AP=1
    ; Prekompilowane SDK dla C3 nie zawiera sterownika licznika impulsów
    ; (PCNT) - pomiar LCO anteny AS3935 działa wtedy na przerwaniach.
    -DSTACJA_LIGHTNING_NO_PCNT=1

; Moduły sieciowe nie wchodzą do firmware'u węzła. Sterowniki czujników,
; zapis ustawień i magistrala RS485 zostają bez zmian.
build_src_filter = +<*> -<web_server.cpp> -<mqtt_client.cpp> -<weather_services.cpp> -<ota.cpp> -<alerts.cpp> -<openmeteo.cpp>

; Węzeł C3 nie ma OTA (nie ma Wi-Fi) - firmware wgrywa się kablem:
;     pio run -e esp32c3-node -t upload --upload-port COM<n>
; Wgranie nowej wersji nie kasuje ustawień ani NVS.

; ======================================================
;  Węzły C3 "z adresem" - gotowe binarki dla kolejnych modułów na magistrali.
;  Każde środowisko kompiluje TEN SAM firmware węzła, ale z innym adresem
;  fabrycznym (STACJA_NODE_ADDR=N). Świeży moduł (pusta NVS) po wgraniu takiej
;  binarki startuje od razu na swoim adresie - kilka modułów nie koliduje.
;  Adres zapisany potem w NVS (np. nadany z www mastera) ma pierwszeństwo.
;  Uniwersalny [env:esp32c3-node] to adres 2.
; ======================================================
[env:esp32c3-node-addr3]
extends = env:esp32c3-node
build_flags = ${env:esp32c3-node.build_flags} -DSTACJA_NODE_ADDR=3

[env:esp32c3-node-addr4]
extends = env:esp32c3-node
build_flags = ${env:esp32c3-node.build_flags} -DSTACJA_NODE_ADDR=4

[env:esp32c3-node-addr5]
extends = env:esp32c3-node
build_flags = ${env:esp32c3-node.build_flags} -DSTACJA_NODE_ADDR=5

[env:esp32c3-node-addr6]
extends = env:esp32c3-node
build_flags = ${env:esp32c3-node.build_flags} -DSTACJA_NODE_ADDR=6

[env:esp32c3-node-addr7]
extends = env:esp32c3-node
build_flags = ${env:esp32c3-node.build_flags} -DSTACJA_NODE_ADDR=7

[env:esp32c3-node-addr8]
extends = env:esp32c3-node
build_flags = ${env:esp32c3-node.build_flags} -DSTACJA_NODE_ADDR=8

; ======================================================
;  WĘZŁY NA ARDUINO CORE 3.x (platforma pioarduino)
;
;  Oficjalna platforma espressif32 (nawet wersja 7.x) nadal
;  dostarcza rdzeń Arduino 2.0.17, który NIE obsługuje ESP32-C6.
;  Te środowiska używają fork-a pioarduino (Arduino core 3.x +
;  ESP-IDF 5.x), żeby zbudować TEN SAM firmware węzła headless
;  na ESP32-C3 i ESP32-C6.
;
;  Master S3 zostaje celowo na core 2.0.17 (env:esp32s3-*):
;  tam rdzeń 3.x łamie niskopoziomowy sterownik SDMMC
;  (formatowanie karty), I2S i PCNT.
; ======================================================
[env:esp32c3-node-v3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions-4mb.csv
board_build.filesystem = littlefs

; Obraz LittleFS bez data\node (patrz tools/stage_node_fs.py).
extra_scripts = pre:tools/stage_node_fs.py

lib_deps =
    ${env:esp32s3.lib_deps}

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DSTACJA_ROLE_MASTER=0
    ; Węzeł bez sieci - ta flaga wycina stronę www, AP, Wi-Fi, MQTT,
    ; serwisy pogodowe i OTA (opis w env:esp32c3-node).
    -DSTACJA_HEADLESS=1
    -DSTACJA_NODE_BAUD=19200
    -DSTACJA_NODE_RECOVERY_AP=1
    -DSTACJA_LIGHTNING_NO_PCNT=1

build_src_filter = +<*> -<web_server.cpp> -<mqtt_client.cpp> -<weather_services.cpp> -<ota.cpp> -<alerts.cpp> -<openmeteo.cpp>

; Węzeł ESP32-C6 - ten sam firmware headless co C3, ale z natywnym
; wsparciem rdzenia 3.x (C6 nie istnieje w core 2.0.17).
[env:esp32c6-node]
extends = env:esp32c3-node-v3
board = esp32-c6-devkitc-1
build_flags =
    ${env:esp32c3-node-v3.build_flags}

; Adresowane binarki węzła C6 (moduły 3..8) - analogicznie jak C3.
[env:esp32c6-node-addr3]
extends = env:esp32c6-node
build_flags = ${env:esp32c6-node.build_flags} -DSTACJA_NODE_ADDR=3

[env:esp32c6-node-addr4]
extends = env:esp32c6-node
build_flags = ${env:esp32c6-node.build_flags} -DSTACJA_NODE_ADDR=4

[env:esp32c6-node-addr5]
extends = env:esp32c6-node
build_flags = ${env:esp32c6-node.build_flags} -DSTACJA_NODE_ADDR=5

[env:esp32c6-node-addr6]
extends = env:esp32c6-node
build_flags = ${env:esp32c6-node.build_flags} -DSTACJA_NODE_ADDR=6

[env:esp32c6-node-addr7]
extends = env:esp32c6-node
build_flags = ${env:esp32c6-node.build_flags} -DSTACJA_NODE_ADDR=7

[env:esp32c6-node-addr8]
extends = env:esp32c6-node
build_flags = ${env:esp32c6-node.build_flags} -DSTACJA_NODE_ADDR=8

[env:esp32s3-node-ota]
extends = env:esp32s3-node
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=stacja-ota
