; ==============================================================================
; Stacja Pogody - węzeł jakości powietrza / pogody na ESP32-C3 SuperMini
; (osobny moduł "c3air")
;
; Czujniki:
;   - AHT20 (I2C 0x38)           -> temperatura + wilgotność
;   - BMP280 (I2C 0x76/0x77)     -> ciśnienie
;   - PMS7003 (UART0 9600)       -> PM1.0 / PM2.5 / PM10
; Piny (stałe w firmware, patrz main.cpp):
;   I2C  SDA = GPIO 8, SCL = GPIO 9
;   PMS  RX  = GPIO 20,  TX = GPIO 21  (UART0; konsola idzie na USB CDC)
;
; Funkcje: Wi-Fi STA ze statycznym IP 192.168.1.147 (konfigurowalny) + AP
; awaryjny, panel www (pulpit / kalibracja / ustawienia / OTA / logi),
; MQTT -> Home Assistant (auto-discovery) i /api/status do importu przez
; stację pogody (zakładka "Urządzenia zewnętrzne", typ "aq").
; ==============================================================================
[env:esp32c3-air]
platform = espressif32 @ ^6.7.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; Dwie partycje aplikacji (ota_0 / ota_1) + otadata -> OTA z rollbackiem:
; po wgraniu nowej wersji, jeśli nie oznaczysz jej jako sprawnej (robimy to
; w setup), bootloader sam wróci do poprzedniej. Nie da się "ubić" urządzenia
; nieudanym OTA - zawsze działa co najmniej jedna partycja.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Aktualizacja przez Wi-Fi (po pierwszym wgraniu kablem):
;     pio run -e esp32c3-air -t upload --upload-port 192.168.1.147
; (protokół espota) albo strona /ota w przeglądarce.
[env:esp32c3-air-ota]
extends = env:esp32c3-air
upload_protocol = espota
upload_port = 192.168.1.147
