; ==============================================================================
; Stacja Pogody - węzeł jakości powietrza / pogody na ESP32-C3 SuperMini
; (osobny moduł "c3air")
;
; Czujniki:
;   - AHT20 (I2C 0x38)           -> temperatura + wilgotność
;   - BMP280 (I2C 0x76/0x77)     -> ciśnienie
;   - PMS7003 (UART0 9600)       -> PM1.0 / PM2.5 / PM10
; Piny (stałe w firmware, patrz main.cpp):
;   I2C  SDA = GPIO 8, SCL = GPIO 9
;   PMS  RX  = GPIO 20, TX = GPIO 5   (TX przeniesione z GPIO21 - zajęte na płytce)
;
; Funkcje: Wi-Fi STA ze statycznym IP 192.168.1.147 (konfigurowalny) + AP
; awaryjny, panel www (pulpit / kalibracja / ustawienia / OTA / logi),
; MQTT -> Home Assistant (auto-discovery) i /api/status do importu przez
; stację pogody (zakładka "Urządzenia zewnętrzne", typ "aq").
; ==============================================================================
[env:esp32c3-air]
platform = espressif32 @ ^6.7.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; Dwie partycje aplikacji (ota_0 / ota_1) + otadata -> OTA z rollbackiem:
; po wgraniu nowej wersji, jeśli nie oznaczysz jej jako sprawnej (robimy to
; w setup), bootloader sam wróci do poprzedniej. Nie da się "ubić" urządzenia
; nieudanym OTA - zawsze działa co najmniej jedna partycja.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Aktualizacja przez Wi-Fi (po pierwszym wgraniu kablem):
;     pio run -e esp32c3-air -t upload --upload-port 192.168.1.147
; (protokół espota) albo strona /ota w przeglądarce.
[env:esp32c3-air-ota]
extends = env:esp32c3-air
upload_protocol = espota
upload_port = 192.168.1.147

; ==============================================================================
; Ten sam program stacji powietrza na ESP32-S3 WROOM-1 N16R8 (16 MB flash,
; 8 MB PSRAM octal). Używane, gdy węzeł ma być na S3, a nie na C3 - kod jest
; wspólny, różni się tylko definicja płytki i tabela partycji.
;
; Piny pozostają te same (I2C: 8/9, PMS7003: RX=20, TX=5) - na S3 wszystkie
; są wolne. Uwaga: na S3 konsola NIE idzie natywnym USB, a UART0 (GPIO43/44),
; czyli po tym samym mostku USB-UART (np. CH343), przez który wgrywa się
; firmware - dlatego czujnik pyłu siedzi na UART1 (patrz C3AIR_ESP32S3
; w main.cpp), a nie na UART0.
; ==============================================================================
[env:esp32s3-air]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

; Tabela partycji z projektu głównego (16 MB: 2x OTA po 3 MB + LittleFS).
board_build.partitions = ..\partitions.csv
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -DC3AIR_ESP32S3=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCORE_DEBUG_LEVEL=0

[env:esp32s3-air-ota]
extends = env:esp32s3-air
upload_protocol = espota

; --- ESP32-S3 z 8 MB flashu (N8 / N8R8) ---
[env:esp32s3-air-8mb]
extends = env:esp32s3-air
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = ..\partitions-8mb.csv

; ==============================================================================
; Klasyczny ESP32 (WROOM-32) - dwie wersje: 4 MB i 8 MB flashu.
; Uwaga na piny: w tym układzie GPIO20 NIE ISTNIEJE, a konsola siedzi na UART0,
; dlatego pył idzie po UART2 (Serial2, 16/17), a I2C na 21/22. Przełącznik
; C3AIR_ESP32_CLASSIC ustawia to w main.cpp.
; ==============================================================================
[env:esp32-air-4mb]
platform = espressif32 @ ^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = ..\partitions-4mb.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
    -DC3AIR_ESP32_CLASSIC=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCORE_DEBUG_LEVEL=0

[env:esp32-air-8mb]
extends = env:esp32-air-4mb
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = ..\partitions-8mb.csv
