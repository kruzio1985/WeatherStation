; ============================================================
;  Bramka BLE dla stacji pogody (ESP32-C3 SuperMini)
;  Skanuje czujniki BT (Xiaomi, ATC, Govee, BTHome, Inkbird,
;  ThermoPro, Moat, Jaalee), dekoduje i wysyła do mastera.
;  Nieznane czujniki (np. SETTI SS302) są pokazywane jako
;  surowa ramka hex na stronie / - do dodania dekodera.
; ============================================================
[env:esp32c3-blegw]
platform = espressif32 @ ^6.7.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = ../partitions-4mb.csv
board_build.filesystem = littlefs

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BME280 Library @ ^2.2.4
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -I../include

; Aktualizacja przez Wi-Fi (ArduinoOTA, bez kabla USB):
;     pio run -e esp32c3-blegw-ota -t upload --upload-port 192.168.1.148
; Albo z przeglądarki: strona /ota (wgraj firmware.bin).
[env:esp32c3-blegw-ota]
extends = env:esp32c3-blegw
upload_protocol = espota
upload_port = 192.168.1.148
