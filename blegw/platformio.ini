; ============================================================
;  Bramka BLE dla stacji pogody (ESP32-C3 SuperMini)
;  Skanuje czujniki BT (Xiaomi, ATC, Govee, BTHome, Inkbird,
;  ThermoPro, Moat, Jaalee), dekoduje i wysyła do mastera.
;  Nieznane czujniki (np. SETTI SS302) są pokazywane jako
;  surowa ramka hex na stronie / - do dodania dekodera.
; ============================================================
[env:esp32c3-blegw]
platform = espressif32 @ ^6.7.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.filesystem = littlefs

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -I../include
