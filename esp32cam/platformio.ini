; =============================================================================
; Stacja Pogody - zewnętrzna kamera ESP32-CAM (AI-Thinker)
; Osobny moduł: robi zdjęcia JPEG i wysyła je HTTP POST na /api/camera/upload
; do stacji-mastera. Master tylko odbiera, analizuje i zapisuje na karcie SD.
; =============================================================================

[env:esp32cam]
platform = espressif32@^6.7.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  esp32-camera
